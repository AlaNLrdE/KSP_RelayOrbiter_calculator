name: C/C++ CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: make app
      run: cd build
    - name: make app (con -C)
      run: make -C build app
    - name: make test (con -C)
      run: make -C build test
